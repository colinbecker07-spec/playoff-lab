<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playoff Lab — 2026 NFL playoff odds</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <svg class="logo" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10.5 3h7M11.5 3v7.2L5.2 22.2a2.2 2.2 0 0 0 2 3.3h13.6a2.2 2.2 0 0 0 2-3.3L16.5 10.2V3"/>
          <ellipse cx="14" cy="20" rx="4.8" ry="2.8" transform="rotate(-28 14 20)" fill="currentColor" stroke="none"/>
          <path d="M12.1 21.3l3.8-2.5" stroke="#0c1118" stroke-width="1.3"/>
        </svg>
        <div>
          <h1>Playoff Lab</h1>
          <p id="asOf"></p>
        </div>
      </div>
      <div id="tabs" class="tabs" role="tablist" aria-label="Weeks"></div>
      <div class="scenario" aria-live="polite">
        <span class="scenario-title" id="scenarioTitle"></span>
        <span class="scenario-sub" id="scenarioSub"></span>
        <button id="btnClear" class="btn small" type="button" hidden>Clear all</button>
      </div>
      <div class="actions">
        <button id="btnRules" class="btn" type="button">Tiebreaker rules</button>
        <button id="btnTheme" class="btn icon" type="button" aria-label="Toggle light/dark theme" title="Toggle theme"></button>
      </div>
    </div>
    <div class="strip" role="tabpanel">
      <button id="stripPrev" class="nav" type="button" aria-label="Scroll games left">‹</button>
      <div id="cards" class="cards"></div>
      <button id="stripNext" class="nav" type="button" aria-label="Scroll games right">›</button>
    </div>
    <div class="progress"><div id="progressBar"></div></div>
  </header>

  <main class="page">
    <div id="results" class="results"></div>
    <p class="footnote" id="footnote"></p>
  </main>

  <dialog id="rulesDialog" class="dialog" aria-labelledby="rulesTitle">
    <div class="dialog-head">
      <h2 id="rulesTitle">NFL tiebreaker procedures</h2>
      <button id="btnRulesClose" class="btn small" type="button">Close</button>
    </div>
    <div id="rulesBody" class="dialog-body"></div>
  </dialog>

  <script src="data.js"></script>
  <script src="updates.js"></script>
  <script src="updates-parser.js"></script>
  <script src="colors.js"></script>
  <script src="rules.js"></script>
  <script src="league.js"></script>
  <script src="tiebreakers.js"></script>
  <script src="simulator.js"></script>
  <script src="app.js"></script>
</body>
</html>
